T.en={ui:{title:'Survey of small business owners and commercial tenants on the future of local shopping centres',intro:'This survey is anonymous and voluntary. There are no right or wrong answers: we are interested in your own experience. You can skip any question and stop at any time. “Changes” means possible renovation, redevelopment or demolition of the building and its surroundings. It does not mean that any of them will be carried out.',start:'Start',next:'Next',back:'Back',finish:'Finish',other:'Please specify',max:'Select up to {n}',thanks:'Thank you for taking part! Your answers will help us better understand the needs of local businesses.',copy:'Copy answers',opt:'optional question',nt:'Data notice',n:'This survey is part of a university course project. We do not ask for your name or contact details, so your answers are anonymous. Taking part is voluntary. Answers are sent only when you complete the survey; after that they cannot be traced back to you or deleted individually. They are used only for this course project and kept until {keep}. Contact person: {contact}. Please do not write names or contact details in open answers. The survey is for people aged 18 or over.',agree:'I have read the notice and agree'},

T.so={ui:{title:'Sahan loogu talagalay milkiilayaasha ganacsiyada yaryar iyo kireystayaasha goobaha ganacsiga ee ku saabsan mustaqbalka xarumaha ganacsiga ee deegaanka',intro:'Sahankani waa mid qarsoodi ah oo ikhtiyaari ah. Jawaabo sax ah ama khalad ah ma jiraan: waxaan xiisaynaynaa khibradaada gaarka ah. Su’aal kasta waad ka boodi kartaa, waadna joojin kartaa wakhti kasta. “Isbeddelada” waxay ula jeedaan dayactir, dib-u-horumarin ama dumis suurtagal ah oo dhismaha iyo agagaarkiisa ku dhaca. Macnaheedu maaha in midkoodna la fulin doono.',start:'Bilow',next:'Xiga',back:'Dib',finish:'Dhammee',other:'Fadlan caddee',max:'Dooro ugu badnaan {n}',thanks:'Waad ku mahadsan tahay ka qaybgalka! Jawaabahaaga waxay naga caawin doonaan inaan si fiican u fahanno baahiyaha ganacsiyada deegaanka.',copy:'Koobi jawaabaha',opt:'su’aal ikhtiyaari ah',nt:'Ogeysiis xog',n:'Sahankan waa qayb ka mid ah mashruuc koorso jaamacadeed. Magacaaga iyo xogta xiriirkaaga ma weydiino, sidaas darteed jawaabahaagu waa qarsoodi. Ka qaybgalku waa ikhtiyaari. Jawaabaha waxaa la soo dirayaa kaliya marka aad dhammaystirto sahanka; kadib laguma xidhi karo adiga mana la tirtiri karo si gooni ah. Waxaa loo isticmaalaa kaliya mashruucan koorsada waxaana la hayaa ilaa {keep}. Qofka laga xiriiro: {contact}. Fadlan ha ku qorin magacyo ama xog xiriir jawaabaha furan. Sahankan waxaa loogu talagalay dadka da’doodu tahay 18 jir ama ka weyn.',agree:'Waan akhriyay ogeysiiska waanan oggolahay'},
s1:['1 — gabi ahaanba ma raacsani','2 — in badan ma raacsani','3 — ma raacsani mana diido','4 — in badan waan raacsanahay','5 — gabi ahaanba waan raacsanahay','Ma aqaan'],
s2:['1 — gabi ahaanba ma werwerinayo','2 — in badan ma werwerinayo','3 — wax yar ayay i werwerisaa','4 — aad bay i werwerisaa','5 — aad iyo aad bay i werwerisaa','Natiijadan ma filayo','Ma aqaan'],

T.ar={ui:{title:'استطلاع رأي لأصحاب المشاريع الصغيرة ومستأجري المحلات التجارية حول مستقبل مراكز التسوق المحلية',intro:'هذا الاستطلاع مجهول الهوية وطوعي. لا توجد إجابات صحيحة أو خاطئة: نحن مهتمون بتجربتك الشخصية. يمكنك تخطي أي سؤال والتوقف في أي وقت. تعني «التغييرات» التجديد أو إعادة التطوير أو الهدم المحتمل للمبنى وما حوله. ولا يعني ذلك أن أيًّا منها سيُنفَّذ.',start:'ابدأ',next:'التالي',back:'السابق',finish:'إنهاء',other:'يرجى التوضيح',max:'اختر {n} كحد أقصى',thanks:'شكرًا لمشاركتك! ستساعدنا إجاباتك على فهم احتياجات المشاريع المحلية بشكل أفضل.',copy:'نسخ الإجابات',opt:'سؤال اختياري',nt:'إشعار بشأن البيانات',n:'هذا الاستطلاع جزء من مشروع في مقرر جامعي. لا نطلب اسمك ولا بيانات الاتصال بك، لذا فإجاباتك مجهولة الهوية. المشاركة طوعية. لا تُرسل الإجابات إلا بعد إكمال الاستطلاع؛ وبعد ذلك لا يمكن ربطها بك ولا حذفها بشكل فردي. تُستخدم فقط في مشروع هذا المقرر وتُحفظ حتى {keep}. الشخص المسؤول للتواصل: {contact}. يُرجى عدم كتابة أسماء أو بيانات اتصال في الإجابات المفتوحة. الاستطلاع موجّه لمن تبلغ أعمارهم 18 عامًا فأكثر.',agree:'قرأتُ الإشعار وأوافق'},
s1:['1 — لا أوافق إطلاقًا','2 — لا أوافق إلى حد ما','3 — لا أوافق ولا أعارض','4 — أوافق إلى حد ما','5 — أوافق تمامًا','لا أعرف'],

T.tr={ui:{title:'Yerel alışveriş merkezlerinin geleceği hakkında küçük işletme sahipleri ve kiracılar için anket',intro:'Bu anket anonim ve gönüllüdür. Doğru ya da yanlış cevap yoktur: kendi deneyiminizle ilgileniyoruz. Herhangi bir soruyu atlayabilir ve istediğiniz zaman bırakabilirsiniz. “Değişiklikler”, binanın ve çevresinin olası yenilenmesi, yeniden geliştirilmesi veya yıkılması anlamına gelir. Bunların gerçekleştirileceği anlamına gelmez.',start:'Başla',next:'İleri',back:'Geri',finish:'Bitir',other:'Lütfen belirtin',max:'En fazla {n} seçin',thanks:'Katıldığınız için teşekkürler! Cevaplarınız yerel işletmelerin ihtiyaçlarını daha iyi anlamamıza yardımcı olacak.',copy:'Cevapları kopyala',opt:'isteğe bağlı soru',nt:'Veri bildirimi',n:'Bu anket bir üniversite ders projesinin parçasıdır. Adınızı veya iletişim bilgilerinizi sormuyoruz, bu nedenle cevaplarınız anonimdir. Katılım gönüllüdür. Cevaplar yalnızca anketi tamamladığınızda gönderilir; sonrasında sizinle ilişkilendirilemez ve tek tek silinemez. Yalnızca bu ders projesinde kullanılır ve {keep} tarihine kadar saklanır. İletişim kişisi: {contact}. Lütfen açık uçlu cevaplara ad veya iletişim bilgisi yazmayın. Anket 18 yaş ve üzeri kişiler içindir.',agree:'Bildirimi okudum ve kabul ediyorum'},
